<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>口算闯关营</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; font-family: -apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#eef4ff; color:#1f2a44; overscroll-behavior:none; }
button { font-family: inherit; border: none; cursor: pointer; }
.screen { height: 100vh; height: 100dvh; width: 100%; overflow: hidden; }

/* ===== 首页 ===== */
.home-wrap { height:100%; display:flex; flex-direction:column; padding:20px 16px; background:linear-gradient(180deg,#dbeafe,#eef4ff 40%); overflow-y:auto; }
.home-title { font-size:28px; font-weight:800; color:#2451c4; text-align:center; margin-top:6px; }
.home-sub { font-size:13px; color:#5a6b8c; text-align:center; margin:4px 0 6px; }
.streak-display { text-align:center; font-size:13px; color:#ff7a00; font-weight:700; min-height:18px; margin-bottom:8px; }
.stage-list { display:grid; grid-template-columns: repeat(3,1fr); gap:10px; }
.stage-card { background:#fff; border-radius:16px; padding:14px 6px; text-align:center; box-shadow:0 4px 12px rgba(36,81,196,.08); transition:transform .1s; }
.stage-card:active { transform:scale(.95); }
.stage-card.soon { opacity:.45; }
.stage-card.mode-kg { background:linear-gradient(160deg,#fff9ec,#fff); border:1.5px solid #ffe4b3; }
.stage-card.mode-elem { background:linear-gradient(160deg,#eef4ff,#fff); border:1.5px solid #cfdcff; }
.stage-icon { font-size:28px; }
.stage-name { font-size:14px; font-weight:700; margin-top:4px; }
.stage-sub { font-size:10px; color:#8b98b3; margin-top:2px; }
.stage-progress-mini { font-size:9px; color:#4f7dfb; font-weight:700; margin-top:3px; }

/* 每日任务卡片 */
.daily-card { border-radius:16px; padding:14px 16px; margin-bottom:12px; box-shadow:0 4px 14px rgba(36,81,196,.1); transition:transform .1s; }
.daily-card:active { transform:scale(.98); }
.daily-elem { background:linear-gradient(135deg,#fff7e0,#ffedbb); border:1.5px solid #f5c451; }
.daily-kg { background:linear-gradient(135deg,#eafff1,#d6ffe6); border:1.5px solid #7ee2a8; }
.daily-title { font-size:15px; font-weight:800; color:#1f2a44; }
.daily-status { font-size:12px; color:#5a6b8c; margin-top:4px; }

/* 关卡进度概览条 */
.progress-wrap { margin-bottom:10px; padding:0 2px; }
.progress-text { font-size:12px; color:#5a6b8c; margin-bottom:5px; font-weight:600; }
.progress-bar { height:8px; background:#e6ecf9; border-radius:5px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#4f7dfb,#2451c4); border-radius:5px; transition:width .3s; }

/* ===== 顶栏 ===== */
.topbar { height:56px; display:flex; align-items:center; justify-content:space-between; padding:max(10px,env(safe-area-inset-top)) 14px 0 14px; background:#fff; border-bottom:1px solid #e6ecf9; flex-shrink:0; }
.back-btn { background:none; font-size:15px; color:#2451c4; font-weight:600; }
.topbar-title { font-size:15px; font-weight:700; }

/* ===== 地图 ===== */
.map-scroll { height:calc(100% - 56px); overflow-y:auto; padding:14px; }
.level-node { display:flex; align-items:center; gap:12px; background:#fff; border-radius:14px; padding:12px 14px; margin-bottom:9px; box-shadow:0 2px 8px rgba(36,81,196,.06); transition:transform .1s; }
.level-node:active { transform:scale(.97); }
.level-node.locked { opacity:.5; }
.level-node.current { border:2px solid #4f7dfb; }
.level-badge { width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; flex-shrink:0; font-size:14px; }
.level-badge.done { background:#ffb300; }
.level-badge.current { background:#4f7dfb; }
.level-badge.locked { background:#b7c2da; }
.level-info-name { font-size:14px; font-weight:700; }
.level-info-sub { font-size:11px; color:#8b98b3; margin-top:2px; }

/* ===== 答题页 ===== */
.answer-page { height:100%; display:flex; flex-direction:column; }
.answer-topbar { height:auto; min-height:56px; padding-bottom:6px; flex-direction:column; align-items:stretch; gap:3px; position:relative; }
.topbar-mid { display:flex; justify-content:space-between; align-items:center; }
.topbar-stats { display:flex; gap:10px; font-size:12px; font-weight:700; }
.dot-green { color:#16a34a; } .dot-red { color:#dc2626; }
.timer { position:absolute; right:14px; top:max(10px,env(safe-area-inset-top)); font-size:12px; font-weight:700; color:#2451c4; background:#eef4ff; padding:4px 9px; border-radius:10px; }

.question-area { flex:1; min-height:0; display:flex; align-items:center; justify-content:center; padding:6px 16px; position:relative; }
.question-card { width:100%; max-width:420px; background:#fff; border-radius:20px; box-shadow:0 8px 24px rgba(36,81,196,.1); display:flex; align-items:center; justify-content:center; font-size:clamp(24px,7vw,42px); font-weight:800; letter-spacing:1px; padding:clamp(10px,4vh,26px) 12px; text-align:center; min-height:70px; }
.question-card.correct { background:#e8fbe9; }
.question-card.wrong { background:#fdecec; }

.speak-btn { flex-shrink:0; margin:0 auto 4px; display:block; background:#eef4ff; color:#2451c4; font-size:13px; font-weight:600; padding:6px 16px; border-radius:20px; }

/* 数字键盘块：答案显示框 + 键盘 */
#arith-block { flex-shrink:0; display:flex; flex-direction:column; }
.answer-display { flex-shrink:0; margin:0 16px 6px; min-height:38px; background:#fff; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:22px; font-weight:700; border:2px solid #4f7dfb; }
.answer-display.placeholder { color:#b7c2da; font-size:15px; font-weight:500; border-color:#e6ecf9; }
.keypad { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:6px 12px max(8px,env(safe-area-inset-bottom)); }
.keypad button { height:clamp(38px,6.5vh,52px); border-radius:12px; background:#fff; font-size:19px; font-weight:700; box-shadow:0 2px 6px rgba(36,81,196,.08); }
.keypad .key-func { background:#fff1f1; color:#dc2626; font-size:14px; }
.keypad .key-confirm { grid-column:span 3; background:linear-gradient(135deg,#4f7dfb,#2451c4); color:#fff; font-size:17px; }

/* 选择题块 */
#choice-block { flex-shrink:0; display:none; grid-template-columns:repeat(2,1fr); gap:10px; padding:8px 16px max(14px,env(safe-area-inset-bottom)); }
.choice-opt { min-height:64px; border-radius:16px; background:#fff; font-size:22px; font-weight:700; box-shadow:0 3px 10px rgba(36,81,196,.1); padding:8px; display:flex; align-items:center; justify-content:center; }
.choice-opt.has-visual { min-height:96px; }
.choice-opt:disabled { opacity:.85; }
.choice-opt.opt-correct { background:#dcfce7; border:2px solid #16a34a; }
.choice-opt.opt-wrong { background:#fee2e2; border:2px solid #dc2626; }
.question-card svg { max-width:100%; }
.money-chip { background:linear-gradient(135deg,#fef3c7,#fde68a); border:2.5px solid #d97706; border-radius:12px; padding:10px 16px; font-size:22px; font-weight:800; color:#92400e; display:inline-flex; align-items:baseline; gap:3px; }
.money-unit { font-size:13px; font-weight:700; }

/* 幼儿园模式：更轻松可爱的配色 */
body.kg-mode .question-card { background:#fffdf5; }
body.kg-mode .choice-opt { border-radius:20px; }

/* 连击称号浮层 */
.combo-badge { position:absolute; left:50%; top:14%; transform:translate(-50%,0) scale(.6); display:flex; align-items:center; gap:8px; padding:10px 20px; border-radius:999px; font-weight:800; color:#fff; font-size:18px; opacity:0; pointer-events:none; animation:badgePop 1.4s ease forwards; box-shadow:0 8px 24px rgba(0,0,0,.2); z-index:5; }
@keyframes badgePop { 0%{opacity:0;transform:translate(-50%,10px) scale(.5);} 15%{opacity:1;transform:translate(-50%,0) scale(1.1);} 25%{transform:translate(-50%,0) scale(1);} 80%{opacity:1;} 100%{opacity:0;transform:translate(-50%,-10px) scale(.9);} }
.badge-lv1{background:linear-gradient(135deg,#ff9966,#ff5e3a);}
.badge-lv2{background:linear-gradient(135deg,#ffd166,#ff9f1c);box-shadow:0 0 24px rgba(255,159,28,.5);}
.badge-lv3{background:linear-gradient(135deg,#9d6bff,#5b3df0);}
.badge-lv4{background:linear-gradient(135deg,#ffd700,#2451c4);box-shadow:0 0 30px rgba(255,215,0,.6);}
.badge-lv5{background:linear-gradient(135deg,#ff3d81,#ffb300);box-shadow:0 0 40px rgba(255,61,129,.7);}

/* ===== 结算页 ===== */
.settlement-wrap { height:100%; overflow-y:auto; display:flex; flex-direction:column; align-items:center; padding:36px 20px max(20px,env(safe-area-inset-bottom)); text-align:center; gap:12px; }
.settle-emoji { font-size:56px; }
.settle-title { font-size:24px; font-weight:800; color:#16a34a; }
.settle-title.fail { color:#dc2626; }
.settle-stats { display:flex; gap:12px; width:100%; max-width:380px; margin:8px 0; justify-content:center; }
.stat-box { flex:1; border-radius:16px; padding:14px 8px; max-width:180px; }
.stat-green{background:#e8fbe9;} .stat-blue{background:#eaf1ff;}
.stat-num{font-size:24px;font-weight:800;}
.stat-green .stat-num{color:#16a34a;} .stat-blue .stat-num{color:#2451c4;}
.stat-label{font-size:11px;color:#8b98b3;margin-top:3px;}
#stat-stars { font-size:34px; color:#ffb300; }
.settle-titles-label{font-size:13px;color:#8b98b3;}
.settle-titles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:400px;}
.settle-titles .pill{display:flex;align-items:center;gap:6px;padding:8px 16px;border-radius:999px;color:#fff;font-weight:700;font-size:13px;}
.btn-primary{background:linear-gradient(135deg,#4f7dfb,#2451c4);color:#fff;font-size:16px;font-weight:700;padding:15px 26px;border-radius:16px;box-shadow:0 6px 16px rgba(36,81,196,.3);}
.btn-primary.big{width:100%;max-width:340px;}
.btn-secondary{background:#fff;color:#2451c4;border:1.5px solid #cfdcff;font-size:14px;font-weight:600;padding:11px 18px;border-radius:14px;flex:1;}
.settle-secondary{display:flex;gap:10px;width:100%;max-width:340px;margin-top:2px;}
</style>
</head>
<body>

<!-- 首页 -->
<div id="screen-home" class="screen">
  <div class="home-wrap">
    <h1 class="home-title">口算闯关营</h1>
    <p class="home-sub">每天练一点，数学更厉害！</p>
    <div class="streak-display" id="streak-display"></div>
    <div class="stage-list" id="stage-list"></div>
  </div>
</div>

<!-- 地图页 -->
<div id="screen-map" class="screen" style="display:none;">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <div class="topbar-title" id="map-stage-title">地图</div>
    <div style="width:44px;"></div>
  </div>
  <div class="map-scroll" id="map-list"></div>
</div>

<!-- 答题页 -->
<div id="screen-answer" class="screen" style="display:none;">
  <div class="answer-page">
    <div class="topbar answer-topbar">
      <button class="back-btn" id="back-btn-answer">← 返回</button>
      <div class="topbar-mid">
        <div class="topbar-title" id="level-title">关卡</div>
        <div class="topbar-stats" id="elem-hud">
          <span id="qindex">第1题</span>
          <span class="dot-green" id="correct-count">🟢0</span>
          <span class="dot-red" id="wrong-count">🔴0</span>
        </div>
        <div class="topbar-stats" id="kg-hud" style="display:none;"><span id="qindex-kg"></span></div>
      </div>
      <div class="timer" id="timer">10:00</div>
    </div>

    <div class="question-area">
      <div class="question-card" id="question-card"></div>
      <div id="combo-badge-layer"></div>
    </div>

    <button class="speak-btn" onclick="manualSpeak()">🔊 再读一遍</button>

    <div id="arith-block">
      <div class="answer-display placeholder" id="answer-display">请输入答案</div>
      <div class="keypad">
        <button onclick="keypadInput('1')">1</button><button onclick="keypadInput('2')">2</button><button onclick="keypadInput('3')">3</button>
        <button onclick="keypadInput('4')">4</button><button onclick="keypadInput('5')">5</button><button onclick="keypadInput('6')">6</button>
        <button onclick="keypadInput('7')">7</button><button onclick="keypadInput('8')">8</button><button onclick="keypadInput('9')">9</button>
        <button class="key-func" onclick="keypadClear()">清除</button><button onclick="keypadInput('0')">0</button><button class="key-func" onclick="keypadDelete()">删除</button>
        <button class="key-confirm" onclick="keypadConfirm()">确定</button>
      </div>
    </div>

    <div id="choice-block"></div>
  </div>
</div>

<!-- 结算页 -->
<div id="screen-settlement" class="screen" style="display:none;">
  <div class="settlement-wrap">
    <div class="settle-emoji" id="settle-emoji">🎉</div>
    <div class="settle-title" id="settle-title">闯关成功！</div>
    <div class="settle-stats">
      <div class="stat-box stat-green" id="stat-correct-wrap">
        <div class="stat-num" id="stat-correct">-</div>
        <div class="stat-label">首轮正确</div>
      </div>
      <div class="stat-box stat-green" id="stat-stars-wrap" style="display:none;">
        <div id="stat-stars">★★★</div>
        <div class="stat-label">本关评价</div>
      </div>
      <div class="stat-box stat-blue">
        <div class="stat-num" id="stat-time">00:00</div>
        <div class="stat-label">用时</div>
      </div>
    </div>
    <div class="settle-titles-label" id="titles-label">🎖 本关评级</div>
    <div class="settle-titles" id="settle-titles"></div>
    <button class="btn-primary big" id="btn-next-level" onclick="challengeNext()">挑战下一关</button>
    <div class="settle-secondary">
      <button class="btn-secondary" onclick="goToCurrentMap()">返回地图</button>
      <button class="btn-secondary" id="btn-retry-level" onclick="retryLevel()">再玩一次</button>
    </div>
  </div>
</div>

<!-- 失败页 -->
<div id="screen-failed" class="screen" style="display:none;">
  <div class="settlement-wrap">
    <div class="settle-emoji">😅</div>
    <div class="settle-title fail">挑战失败，再来一次吧！</div>
    <button class="btn-primary big" onclick="retryLevel()">重新挑战</button>
    <div class="settle-secondary">
      <button class="btn-secondary" onclick="goToCurrentMap()">返回地图</button>
    </div>
  </div>
</div>

<script>
// ===== 通用工具 =====
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function pick(pool, n) { return shuffle(pool).slice(0, Math.min(n, pool.length)); }
function randInt(min, max) { return Math.floor(Math.random() * (max - min + 1)) + min; }

// ===== 算术题生成（数字键盘类） =====
function numText(n) { return String(n); }

function makeArith(a, op, b, answer) {
  const opWord = op === '+' ? '加' : '减';
  return {
    type: 'arith',
    expression: `${a} ${op} ${b} = ?`,
    answer,
    speechText: `${numText(a)}${opWord}${numText(b)}等于多少`
  };
}

function genAddPool(max, opts = {}) {
  const { noCarry = false, mustCarry = false, minSum = 0, minA = 0 } = opts;
  const pool = [];
  for (let a = minA; a <= max; a++) {
    for (let b = 0; b <= max; b++) {
      const sum = a + b;
      if (sum > max) continue;
      if (sum < minSum) continue;
      if (noCarry && (a % 10 + b % 10) >= 10) continue;
      if (mustCarry && (a % 10 + b % 10) < 10) continue;
      if (a === 0 && b === 0) continue;
      pool.push(makeArith(a, '+', b, sum));
    }
  }
  return pool;
}
function genSubPool(max, opts = {}) {
  const { noBorrow = null, minA = 0 } = opts;
  const pool = [];
  for (let a = minA; a <= max; a++) {
    for (let b = 0; b <= a; b++) {
      const diff = a - b;
      if (noBorrow === true && (a % 10) < (b % 10)) continue;
      if (noBorrow === false && (a % 10) >= (b % 10)) continue;
      if (a === 0 && b === 0) continue;
      pool.push(makeArith(a, '-', b, diff));
    }
  }
  return pool;
}
function genMixPool(max, opts = {}) {
  return shuffle([...genAddPool(max, opts), ...genSubPool(max, opts)]);
}

// 整十数加减整十数
function genTensAddPool(max) {
  const pool = [];
  for (let a = 10; a <= max; a += 10) for (let b = 10; b <= max; b += 10) {
    if (a + b <= max) pool.push(makeArith(a, '+', b, a + b));
  }
  return pool;
}
function genTensSubPool(max) {
  const pool = [];
  for (let a = 20; a <= max; a += 10) for (let b = 10; b <= a; b += 10) {
    pool.push(makeArith(a, '-', b, a - b));
  }
  return pool;
}
// 两位数加减一位数（默认不进位/不退位，符合一下册教材顺序）
function genTwoOneAddPool(max, opts = {}) {
  const { mustCarry = false } = opts;
  const pool = [];
  for (let a = 10; a <= 99; a++) for (let b = 1; b <= 9; b++) {
    const sum = a + b;
    if (sum > max) continue;
    const carries = (a % 10 + b) >= 10;
    if (mustCarry && !carries) continue;
    if (!mustCarry && carries) continue;
    pool.push(makeArith(a, '+', b, sum));
  }
  return pool;
}
function genTwoOneSubPool(max, opts = {}) {
  const { mustBorrow = false } = opts;
  const pool = [];
  for (let a = 10; a <= max; a++) for (let b = 1; b <= 9; b++) {
    if (b > a) continue;
    const borrows = (a % 10) < b;
    if (mustBorrow && !borrows) continue;
    if (!mustBorrow && borrows) continue;
    pool.push(makeArith(a, '-', b, a - b));
  }
  return pool;
}
// 生成一个"取N题"的关卡内容函数（返回array，供 getLevelContent 调用）
function arithLevel(poolFn, count) {
  return () => pick(poolFn(), count);
}

// ===== 选择题生成（点选/选择题类，幼儿园及部分小学概念题共用） =====
// option: { label(展示文字/emoji), correct(bool), size(可选，用于大小/高矮对比的字号) }
function makeChoice(promptText, speechText, options) {
  return { type: 'choice', promptText, speechText, options: shuffle(options) };
}

function starsStr(n) { return '⭐'.repeat(n); }
function applesStr(n) { return '🍎'.repeat(n); }

// ===== 可视化组件（钟表/分数/人民币/图形），用于替代纯文字/emoji的题目呈现 =====
function clockSVG(hour, minute) {
  const h = hour % 12;
  const hourAngle = h * 30 + minute * 0.5 - 90;
  const minAngle = minute * 6 - 90;
  const hx = 50 + 20 * Math.cos(hourAngle * Math.PI / 180);
  const hy = 50 + 20 * Math.sin(hourAngle * Math.PI / 180);
  const mx = 50 + 32 * Math.cos(minAngle * Math.PI / 180);
  const my = 50 + 32 * Math.sin(minAngle * Math.PI / 180);
  return `<svg viewBox="0 0 100 100" width="86" height="86">
    <circle cx="50" cy="50" r="46" fill="#fff" stroke="#2451c4" stroke-width="4"/>
    <text x="50" y="20" font-size="11" text-anchor="middle" fill="#1f2a44">12</text>
    <text x="82" y="54" font-size="11" text-anchor="middle" fill="#1f2a44">3</text>
    <text x="50" y="88" font-size="11" text-anchor="middle" fill="#1f2a44">6</text>
    <text x="18" y="54" font-size="11" text-anchor="middle" fill="#1f2a44">9</text>
    <line x1="50" y1="50" x2="${hx}" y2="${hy}" stroke="#1f2a44" stroke-width="4.5" stroke-linecap="round"/>
    <line x1="50" y1="50" x2="${mx}" y2="${my}" stroke="#4f7dfb" stroke-width="3" stroke-linecap="round"/>
    <circle cx="50" cy="50" r="3.5" fill="#1f2a44"/>
  </svg>`;
}
function fractionSVG(num, den) {
  const w = 64 / den;
  let rects = '';
  for (let i = 0; i < den; i++) {
    const filled = i < num;
    rects += `<rect x="${8 + i * w}" y="16" width="${w - 2}" height="32" fill="${filled ? '#4f7dfb' : '#eef4ff'}" stroke="#2451c4" stroke-width="2"/>`;
  }
  return `<svg viewBox="0 0 80 64" width="90" height="72">${rects}</svg>`;
}
function moneyChip(value, unit) {
  const u = unit || '元';
  const prefix = u === '元' ? '¥' : '';
  return `<div class="money-chip">${prefix}${value}<span class="money-unit">${u}</span></div>`;
}
const SHAPE_PATHS = {
  circle: '<circle cx="40" cy="40" r="32"/>',
  square: '<rect x="10" y="10" width="60" height="60"/>',
  triangle: '<polygon points="40,8 74,70 6,70"/>',
  rectangle: '<rect x="6" y="20" width="68" height="40"/>',
  pentagon: '<polygon points="40,6 74,30 61,70 19,70 6,30"/>',
};
function shapeSVG(shape, color) {
  return `<svg viewBox="0 0 80 80" width="60" height="60"><g fill="${color || '#4f7dfb'}">${SHAPE_PATHS[shape] || ''}</g></svg>`;
}

  // 三数连加连减（简化：a+b+c 或 a-b-c，左到右计算）
  function make3(a, op1, b, op2, c) {
    const v1 = op1 === '+' ? a + b : a - b;
    const answer = op2 === '+' ? v1 + c : v1 - c;
    const w1 = op1 === '+' ? '加' : '减';
    const w2 = op2 === '+' ? '加' : '减';
    return {
      type: 'arith',
      expression: `${a} ${op1} ${b} ${op2} ${c} = ?`,
      answer,
      speechText: `${a}${w1}${b}${w2}${c}等于多少`
    };
  }
  function gen3Pool(max, ops) {
    const pool = [];
    for (let a = 0; a <= max; a++) for (let b = 0; b <= max; b++) for (let c = 0; c <= max; c++) {
      for (const [op1, op2] of ops) {
        const v1 = op1 === '+' ? a + b : a - b;
        if (v1 < 0 || v1 > max) continue;
        const ans = op2 === '+' ? v1 + c : v1 - c;
        if (ans < 0 || ans > max) continue;
        if (a===0 && b===0 && c===0) continue;
        pool.push(make3(a, op1, b, op2, c));
      }
    }
    return pool;
  }

    const pool = [];

    const pool = [];

      pool.push({ type: 'arith', expression: `${dividend} ÷ ${a} = ?`, answer: b, speechText: `${dividend}除以${a}等于多少` });

// ===== 语音解锁（修复移动端语音无法播放的核心问题） =====
// 原理：iOS Safari等移动浏览器要求语音合成必须由"用户直接点击"同步触发才允许播放，
// 通过setTimeout等延迟触发的语音会被静默拦截。这里在用户进入App后的第一次点击时，
// 同步播放一条几乎无声的语音来"解锁"，之后整个会话里延迟触发的语音也能正常播放。
(function () {
  let unlocked = false;
  function unlockSpeech() {
    if (unlocked) return;
    unlocked = true;
    if ('speechSynthesis' in window) {
      try {
        const u = new SpeechSynthesisUtterance(' ');
        u.volume = 0.01;
        window.speechSynthesis.speak(u);
      } catch (e) {}
    }
  }
  document.addEventListener('click', unlockSpeech, { once: true, capture: true });
  document.addEventListener('touchend', unlockSpeech, { once: true, capture: true });
})();

class SpeechQueue {
  constructor() { this.queue = []; this.speaking = false; this.currentUtteranceId = 0; }
  stopAll() {
    if ('speechSynthesis' in window) { try { window.speechSynthesis.cancel(); } catch (e) {} }
    this.queue = []; this.speaking = false; this.currentUtteranceId++;
  }
  enqueue(text, { rate = 1, pitch = 1, onEnd = null } = {}) {
    const id = this.currentUtteranceId;
    this.queue.push({ text, rate, pitch, onEnd, id });
    this._processNext();
  }
  speakImmediate(text, opts = {}) { this.stopAll(); this.enqueue(text, opts); }
  _processNext() {
    if (this.speaking) return;
    const item = this.queue.shift();
    if (!item) return;
    this.speaking = true;
    const myId = item.id;
    if (!('speechSynthesis' in window)) {
      this.speaking = false; if (item.onEnd) item.onEnd(); this._processNext(); return;
    }
    let utter;
    try {
      utter = new SpeechSynthesisUtterance(item.text);
      utter.lang = 'zh-CN'; utter.rate = item.rate; utter.pitch = item.pitch;
    } catch (e) {
      this.speaking = false; if (item.onEnd) item.onEnd(); this._processNext(); return;
    }
    const finish = () => {
      if (myId !== this.currentUtteranceId) return;
      this.speaking = false; if (item.onEnd) item.onEnd(); this._processNext();
    };
    utter.onend = finish; utter.onerror = finish;
    try { window.speechSynthesis.speak(utter); } catch (e) { finish(); }
  }
}
window.speechQueue = new SpeechQueue();

// 题量较少的关卡按比例缩放连击阈值（如题量只有10题左右）
function scaledComboTitles(questionCount) {
  if (questionCount >= 18) return COMBO_TITLES;
  const ratio = questionCount / 20;
  return COMBO_TITLES.map(t => ({ ...t, threshold: Math.max(2, Math.round(t.threshold * ratio)) }))
    .filter((t, i, arr) => arr.findIndex(x => x.threshold === t.threshold) === i)
    .sort((a,b) => b.threshold - a.threshold);
}

function checkComboTitle(streak, announcedMaxThreshold, titles) {
  for (const t of titles) { if (streak >= t.threshold && t.threshold > announcedMaxThreshold) return t; }
  return null;
}

function computeSettlementTitles({ firstRoundCorrect, firstRoundWrong, avgSeconds, maxComboReached }) {
  const total = firstRoundCorrect + firstRoundWrong;
  const accuracy = total > 0 ? firstRoundCorrect / total : 0;
  const titles = [];
  const isPerfect = firstRoundWrong === 0;
  const isUltimate = maxComboReached >= 10 && isPerfect && avgSeconds < 15;
  if (isUltimate) {
    titles.push({ name: '绝世无双王者', icon: '👑', cls: 'badge-lv5', desc: '速度、准确率、连答全部拉满，获得终极绝世无双王者' });
  } else {
    if (isPerfect) titles.push({ name: '最强王者', icon: '⭐', cls: 'badge-lv4', desc: '整关零失误完美通关，获得最强王者' });
    else if (accuracy >= 0.85) titles.push({ name: '暴击王者', icon: '💥', cls: 'badge-lv3', desc: '计算稳定性拉满，获得暴击王者' });
    if (avgSeconds < 30) titles.push({ name: '闪电王者', icon: '⚡', cls: 'badge-lv3', desc: '看题秒出答案，获得闪电王者' });
    else if (avgSeconds < 40) titles.push({ name: '疾行王者', icon: '💨', cls: 'badge-lv2', desc: '答题速度远超标准，获得疾行王者' });
  }
  return titles;
}
window.KS_TITLES = { randomEncourage, COMBO_TITLES, scaledComboTitles, checkComboTitle, computeSettlementTitles };

// ===== 打卡 =====
function markDailyCheckin() {
  const p = loadProgress();
  const today = new Date().toISOString().slice(0, 10);
  p.checkin = p.checkin || { lastDate: null, streak: 0 };
  if (p.checkin.lastDate === today) { saveProgress(p); return; }
  const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
  p.checkin.streak = (p.checkin.lastDate === yesterday) ? p.checkin.streak + 1 : 1;
  p.checkin.lastDate = today;
  saveProgress(p);
}
function getStreak() { const p = loadProgress(); return p.checkin ? p.checkin.streak : 0; }

// ===== 每日挑战/每日练习：记录与题库组装 =====
function todayStr() { return new Date().toISOString().slice(0, 10); }
function loadDailyRecord(stageId) {
  const p = loadProgress();
  p.daily = p.daily || {};
  return p.daily[stageId + '_' + todayStr()] || null;
}
function saveDailyRecord(stageId, rec) {
  const p = loadProgress();
  p.daily = p.daily || {};
  p.daily[stageId + '_' + todayStr()] = rec;
  saveProgress(p);
}
function buildDailyQuestions(stageId) {
  const st = getStage(stageId);
  const { shuffle, pick } = window.KS;
  const sp = getStageProgress(stageId);
  const unlockedLevels = st.levels.slice(0, Math.max(1, sp.maxUnlocked));
  let concept = [];
  unlockedLevels.forEach(lv => { try { concept = concept.concat(lv.content().filter(q => q.type === 'choice')); } catch (e) {} });

  if (st.mode === 'kg') {
    let arithFn = DAILY_POOL_FNS[stageId];
    let arith = arithFn ? arithFn() : [];
    const pool = shuffle([...concept, ...arith]);
    return pick(pool, Math.min(5, Math.max(3, pool.length)));
  } else {
    const arithFn = DAILY_POOL_FNS[stageId];
    const arith = arithFn ? arithFn() : [];
    const arithSample = pick(arith, 12);
    const conceptSample = pick(concept, 3);
    return shuffle([...arithSample, ...conceptSample]);
  }
}

const TIME_LIMIT = { short: 300, long: 600 };

function startLevel(stageId, levelNum) {
  window.speechQueue.stopAll();
  const st = getStage(stageId);
  const lvDef = st.levels[levelNum - 1];
  const questions = lvDef.content();
  const mode = st.mode;
  rt = {
    stageId, levelNum, mode, questions,
    phase: 'first', index: 0,
    correctCount: 0, wrongCount: 0, wrongQueue: [], retryIndex: 0, retryFailed: false,
    comboStreak: 0, announcedMaxThreshold: 0, overallBestThreshold: 0, maxComboReached: 0,
    currentInput: '', selectedChoice: null,
    startTime: Date.now(), questionStartTime: Date.now(), questionTimes: [],
    remainingSec: questions.length <= 12 ? TIME_LIMIT.short : TIME_LIMIT.long,
    comboTitles: window.KS_TITLES.scaledComboTitles(questions.length),
  };
  document.getElementById('level-title').textContent = `${st.name}·第${levelNum}关 ${lvDef.name}`;
  document.body.classList.toggle('kg-mode', mode === 'kg');
  document.getElementById('elem-hud').style.display = mode === 'elem' ? 'flex' : 'none';
  document.getElementById('kg-hud').style.display = mode === 'kg' ? 'flex' : 'none';
  document.getElementById('back-btn-answer').onclick = mode === 'elem' ? confirmExit : () => { clearInterval(timerHandle); goToCurrentMap(); };
  showScreen('screen-answer');
  if (mode === 'elem') startTimer(); else document.getElementById('timer').textContent = '';
  renderQuestion();
}

function startTimer() {
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    if (!rt) return;
    rt.remainingSec--;
    updateTimerUI();
    if (rt.remainingSec <= 0) { clearInterval(timerHandle); onTimeout(); }
  }, 1000);
  updateTimerUI();
}
function updateTimerUI() {
  const m = Math.floor(rt.remainingSec / 60).toString().padStart(2, '0');
  const s = (rt.remainingSec % 60).toString().padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

function currentQuestion() {
  if (rt.phase === 'first') return rt.questions[rt.index];
  return rt.wrongQueue[rt.retryIndex];
}

function renderQuestion() {
  const q = currentQuestion();
  rt.currentInput = ''; rt.selectedChoice = null;
  rt.questionStartTime = Date.now();

  const total = rt.questions.length;
  const label = rt.phase === 'first' ? `第${rt.index + 1}/${total}题` : `错题重答 ${rt.retryIndex + 1}/${rt.wrongQueue.length}`;
  if (rt.mode === 'elem') {
    document.getElementById('qindex').textContent = label;
    document.getElementById('correct-count').textContent = '🟢' + rt.correctCount;
    document.getElementById('wrong-count').textContent = '🔴' + rt.wrongCount;
  } else {
    document.getElementById('qindex-kg').textContent = `第${rt.index + 1}/${total}题`;
  }

  const card = document.getElementById('question-card');
  card.className = 'question-card';

  const arithBlock = document.getElementById('arith-block');
  const choiceBlock = document.getElementById('choice-block');

  if (q.type === 'arith') {
    card.textContent = q.expression;
    arithBlock.style.display = 'flex';
    choiceBlock.style.display = 'none';
    document.getElementById('answer-display').textContent = '';
    document.getElementById('answer-display').classList.remove('placeholder');
    document.getElementById('answer-display').textContent = '';
    setPlaceholder();
    window.speechQueue.speakImmediate(q.speechText, { rate: 1, pitch: 1 });
  } else {
    if (q.promptVisual) {
      card.innerHTML = window.KS.renderVisual(q.promptVisual);
    } else {
      card.textContent = q.promptText;
    }
    arithBlock.style.display = 'none';
    choiceBlock.style.display = 'grid';
    choiceBlock.innerHTML = '';
    q.options.forEach(opt => {
      const btn = document.createElement('button');
      btn.className = 'choice-opt' + (opt.visual ? ' has-visual' : '');
      if (opt.visual) {
        btn.innerHTML = window.KS.renderVisual(opt.visual);
      } else {
        btn.style.fontSize = opt.size ? opt.size + 'px' : '';
        btn.textContent = opt.label;
      }
      btn.onclick = () => submitChoice(opt, btn);
      choiceBlock.appendChild(btn);
    });
    window.speechQueue.speakImmediate(q.speechText, { rate: 1, pitch: 1 });
  }
}

function setPlaceholder() {
  const disp = document.getElementById('answer-display');
  if (rt.currentInput === '') { disp.textContent = '请输入答案'; disp.classList.add('placeholder'); }
  else { disp.textContent = rt.currentInput; disp.classList.remove('placeholder'); }
}

function manualSpeak() {
  const q = currentQuestion(); if (!q) return;
  window.speechQueue.speakImmediate(q.speechText, { rate: 1, pitch: 1 });
}

// ---- 数字键盘 ----
function keypadInput(d) {
  if (rt.currentInput.length >= 4) return;
  rt.currentInput += d; setPlaceholder();
}
function keypadClear() { rt.currentInput = ''; setPlaceholder(); }
function keypadDelete() { rt.currentInput = rt.currentInput.slice(0, -1); setPlaceholder(); }

function keypadConfirm() {
  if (rt.currentInput === '') {
    const disp = document.getElementById('answer-display');
    disp.textContent = '请先输入答案哦'; disp.classList.remove('placeholder');
    disp.style.color = '#dc2626';
    setTimeout(() => { disp.style.color = ''; setPlaceholder(); }, 900);
    return;
  }
  const q = currentQuestion();
  const userAnswer = parseInt(rt.currentInput, 10);
  const isCorrect = userAnswer === q.answer;
  judgeAndProceed(isCorrect);
}

// ---- 选择题 ----
function submitChoice(opt, btnEl) {
  document.querySelectorAll('.choice-opt').forEach(b => b.disabled = true);
  const isCorrect = !!opt.correct;
  btnEl.classList.add(isCorrect ? 'opt-correct' : 'opt-wrong');
  if (!isCorrect) {
    const correctBtn = Array.from(document.querySelectorAll('.choice-opt')).find((b, i) => currentQuestion().options[i].correct);
    if (correctBtn) correctBtn.classList.add('opt-correct');
  }
  judgeAndProceed(isCorrect);
}

// ---- 统一判定与推进 ----
function judgeAndProceed(isCorrect) {
  const q = currentQuestion();
  const elapsed = (Date.now() - rt.questionStartTime) / 1000;
  rt.questionTimes.push(elapsed);

  const card = document.getElementById('question-card');
  card.classList.add(isCorrect ? 'correct' : 'wrong');

  if (rt.mode === 'kg') {
    // 幼儿园段：不强制重答，答对给星星鼓励，答错温和提示后仍前进
    if (isCorrect) {
      rt.correctCount++;
      window.speechQueue.enqueue(window.KS_TITLES.randomEncourage() + '！', { rate: 1.05, pitch: 1.15 });
    } else {
      rt.wrongCount++;
      window.speechQueue.enqueue('再想想哦', { rate: 0.95, pitch: 1 });
    }
    setTimeout(advanceKg, 900);
    return;
  }

  // 小学段：完整机制
  if (rt.phase === 'first') {
    if (isCorrect) {
      rt.correctCount++; rt.comboStreak++;
      rt.maxComboReached = Math.max(rt.maxComboReached, rt.comboStreak);
    } else {
      rt.wrongCount++; rt.wrongQueue.push(q);
      rt.comboStreak = 0; rt.announcedMaxThreshold = 0;
    }
  } else {
    if (!isCorrect) rt.retryFailed = true;
  }
  document.getElementById('correct-count').textContent = '🟢' + rt.correctCount;
  document.getElementById('wrong-count').textContent = '🔴' + rt.wrongCount;

  let titleTriggered = null;
  if (rt.phase === 'first' && isCorrect) {
    titleTriggered = window.KS_TITLES.checkComboTitle(rt.comboStreak, rt.announcedMaxThreshold, rt.comboTitles);
  }
  if (titleTriggered) {
    rt.announcedMaxThreshold = titleTriggered.threshold;
    rt.overallBestThreshold = Math.max(rt.overallBestThreshold, titleTriggered.threshold);
    showComboBadge(titleTriggered);
    const enc = window.KS_TITLES.randomEncourage();
    window.speechQueue.enqueue(`${enc}！${titleTriggered.name}！`, {
      rate: titleTriggered.rate, pitch: titleTriggered.pitch,
      onEnd: () => setTimeout(advanceElem, 300)
    });
  } else {
    setTimeout(advanceElem, 700);
  }
}

function showComboBadge(title) {
  const layer = document.getElementById('combo-badge-layer');
  layer.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'combo-badge ' + title.cls;
  el.innerHTML = `<span style="font-size:22px">${title.icon}</span><span>${title.name}</span>`;
  layer.appendChild(el);
  setTimeout(() => el.remove(), 1500);
}

function advanceKg() {
  if (!rt) return;
  rt.index++;
  if (rt.index < rt.questions.length) renderQuestion();
  else finishLevel(true);
}
function advanceElem() {
  if (!rt) return;
  if (rt.phase === 'first') {
    rt.index++;
    if (rt.index < rt.questions.length) renderQuestion();
    else if (rt.isDaily || rt.wrongCount === 0) finishLevel(true);
    else { rt.phase = 'retry'; rt.retryIndex = 0; renderQuestion(); }
  } else {
    rt.retryIndex++;
    if (rt.retryIndex < rt.wrongQueue.length) renderQuestion();
    else finishLevel(!rt.retryFailed);
  }
}

function onTimeout() {
  window.speechQueue.stopAll();
  if (rt && rt.isDaily) { finishLevel(true); return; }
  showScreen('screen-failed');
  document.querySelector('#screen-failed .settle-title').textContent = '时间到啦，再挑战一次吧！';
}
function confirmExit() {
  if (confirm('当前进度未保存，确定退出吗？')) {
    clearInterval(timerHandle); window.speechQueue.stopAll(); goToCurrentMap();
  }
}

// ===== 结算 =====
function finishLevel(success) {
  clearInterval(timerHandle);
  window.speechQueue.stopAll();
  const totalTimeSec = Math.round((Date.now() - rt.startTime) / 1000);
  const st = getStage(rt.stageId);

  if (!success) {
    showScreen('screen-failed');
    document.querySelector('#screen-failed .settle-title').textContent = '挑战失败，再来一次吧！';
    return;
  }

  markDailyCheckin();
  if (!rt.isDaily) {
    const sp = getStageProgress(rt.stageId);
    if (!sp.completed.includes(rt.levelNum)) sp.completed.push(rt.levelNum);
    sp.maxUnlocked = Math.max(sp.maxUnlocked, rt.levelNum + 1);
    saveStageProgress(rt.stageId, sp);
  }

  const m = Math.floor(totalTimeSec / 60).toString().padStart(2, '0');
  const s = (totalTimeSec % 60).toString().padStart(2, '0');
  document.getElementById('stat-time').textContent = `${m}:${s}`;
  document.getElementById('settle-emoji').textContent = '🎉';
  document.getElementById('settle-title').textContent = rt.isDaily
    ? (rt.mode === 'kg' ? '今日练习完成！' : '今日挑战完成！')
    : '闯关成功！';

  const titlesEl = document.getElementById('settle-titles');
  titlesEl.innerHTML = '';
  document.getElementById('titles-label').style.display = rt.mode === 'kg' ? 'none' : 'block';

  if (rt.mode === 'kg') {
    const total = rt.correctCount + rt.wrongCount || 1;
    const acc = rt.correctCount / total;
    const stars = acc >= 0.9 ? 3 : acc >= 0.6 ? 2 : 1;
    if (!rt.isDaily) {
      const sp = getStageProgress(rt.stageId);
      sp.stars[rt.levelNum] = Math.max(sp.stars[rt.levelNum] || 0, stars);
      saveStageProgress(rt.stageId, sp);
    } else {
      saveDailyRecord(rt.stageId, { stars, timeSec: totalTimeSec });
    }
    document.getElementById('stat-correct-wrap').style.display = 'none';
    document.getElementById('stat-stars-wrap').style.display = 'block';
    document.getElementById('stat-stars').textContent = '★'.repeat(stars) + '☆'.repeat(3 - stars);
    window.speechQueue.enqueue('今天也很棒哦！', { rate: 1.05, pitch: 1.15 });
  } else {
    const total = rt.correctCount + rt.wrongCount;
    document.getElementById('stat-correct-wrap').style.display = 'block';
    document.getElementById('stat-stars-wrap').style.display = 'none';
    document.getElementById('stat-correct').textContent = `${rt.correctCount}/${total}`;

    const avgSeconds = rt.questionTimes.length ? rt.questionTimes.reduce((a, b) => a + b, 0) / rt.questionTimes.length : 0;
    const settleTitles = window.KS_TITLES.computeSettlementTitles({
      firstRoundCorrect: rt.correctCount, firstRoundWrong: rt.wrongCount,
      avgSeconds, maxComboReached: rt.maxComboReached
    });
    const comboAchieved = rt.comboTitles.find(t => t.threshold === rt.overallBestThreshold);
    const allTitles = [];
    if (comboAchieved) allTitles.push({ name: comboAchieved.name, icon: comboAchieved.icon, cls: comboAchieved.cls, desc: `${comboAchieved.name}！` });
    allTitles.push(...settleTitles);
    allTitles.forEach(t => {
      const pill = document.createElement('div');
      pill.className = 'pill ' + t.cls;
      pill.innerHTML = `<span>${t.icon}</span><span>${t.name}</span>`;
      titlesEl.appendChild(pill);
    });
    allTitles.forEach(t => window.speechQueue.enqueue(t.desc || `获得${t.name}`, { rate: 1.1, pitch: 1.1 }));

    if (rt.isDaily) {
      const accuracy = total > 0 ? Math.round(rt.correctCount / total * 100) : 0;
      saveDailyRecord(rt.stageId, { accuracy, timeText: `${m}:${s}`, timeSec: totalTimeSec, correctCount: rt.correctCount, total });
    }
  }

  const nextBtn = document.getElementById('btn-next-level');
  const retryBtn = document.getElementById('btn-retry-level');
  if (rt.isDaily) {
    nextBtn.style.display = 'none';
    if (retryBtn) retryBtn.style.display = 'none';
  } else {
    if (retryBtn) retryBtn.style.display = 'block';
    const isLastInStage = rt.levelNum >= st.levels.length;
    if (isLastInStage) { nextBtn.textContent = '完成本学段！返回地图'; nextBtn.onclick = goToCurrentMap; }
    else { nextBtn.textContent = '挑战下一关'; nextBtn.onclick = challengeNext; }
    nextBtn.style.display = 'block';
  }

  showScreen('screen-settlement');
}

function challengeNext() { startLevel(rt.stageId, rt.levelNum + 1); }
function retryLevel() { startLevel(rt.stageId, rt.levelNum); }

goHome();



</script>
