<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>口算闯关营</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- 首页 -->
<div id="screen-home" class="screen">
  <div class="home-wrap">
    <h1 class="home-title">口算闯关营</h1>
    <p class="home-sub">每天练一点，口算更厉害！</p>
    <button class="btn-primary big" onclick="goToMap()">🌱 学前班 · 开始闯关</button>
    <p class="home-note">（当前核心版本已实现学前班12关，其余年级陆续接入）</p>
  </div>
</div>

<!-- 地图页 -->
<div id="screen-map" class="screen" style="display:none;">
  <div class="topbar">
    <button class="back-btn" onclick="goHome()">← 返回</button>
    <div class="topbar-title">学前班 · 数字王国</div>
    <div style="width:60px;"></div>
  </div>
  <div class="map-scroll" id="map-list"></div>
</div>

<!-- 答题页：固定视口五区域布局 -->
<div id="screen-answer" class="screen" style="display:none;">
  <div class="answer-page">
    <div class="topbar answer-topbar">
      <button class="back-btn" onclick="confirmExit()">← 返回</button>
      <div class="topbar-mid">
        <div class="topbar-title" id="level-title">学前班·第1关</div>
        <div class="topbar-stats">
          <span id="qindex">第1/20题</span>
          <span class="dot-green" id="correct-count">🟢0</span>
          <span class="dot-red" id="wrong-count">🔴0</span>
        </div>
      </div>
      <div class="timer" id="timer">10:00</div>
    </div>

    <div class="question-area" id="question-area">
      <div class="question-card" id="question-card"></div>
      <div id="combo-badge-layer"></div>
    </div>

    <button class="speak-btn" id="speak-btn" onclick="manualSpeak()">🔊 再读一遍</button>

    <div class="answer-display" id="answer-display"></div>

    <div class="keypad" id="keypad">
      <button onclick="keypadInput('1')">1</button>
      <button onclick="keypadInput('2')">2</button>
      <button onclick="keypadInput('3')">3</button>
      <button onclick="keypadInput('4')">4</button>
      <button onclick="keypadInput('5')">5</button>
      <button onclick="keypadInput('6')">6</button>
      <button onclick="keypadInput('7')">7</button>
      <button onclick="keypadInput('8')">8</button>
      <button onclick="keypadInput('9')">9</button>
      <button class="key-func" onclick="keypadClear()">清除</button>
      <button onclick="keypadInput('0')">0</button>
      <button class="key-func" onclick="keypadDelete()">删除</button>
      <button class="key-confirm" onclick="keypadConfirm()">确定</button>
    </div>
  </div>
</div>

<!-- 结算页 -->
<div id="screen-settlement" class="screen" style="display:none;">
  <div class="settlement-wrap">
    <div class="settle-emoji" id="settle-emoji">🎉</div>
    <div class="settle-title" id="settle-title">闯关成功！</div>
    <div class="settle-stats">
      <div class="stat-box stat-green">
        <div class="stat-num" id="stat-correct">20/20</div>
        <div class="stat-label">首轮正确</div>
      </div>
      <div class="stat-box stat-blue">
        <div class="stat-num" id="stat-time">00:00</div>
        <div class="stat-label">用时</div>
      </div>
    </div>
    <div class="settle-titles-label">🎖 本关评级</div>
    <div class="settle-titles" id="settle-titles"></div>
    <button class="btn-primary big" id="btn-next-level" onclick="challengeNext()">挑战下一关</button>
    <div class="settle-secondary">
      <button class="btn-secondary" onclick="goToMap()">返回地图</button>
      <button class="btn-secondary" onclick="retryLevel()">再玩一次</button>
    </div>
  </div>
</div>

<!-- 失败页 -->
<div id="screen-failed" class="screen" style="display:none;">
  <div class="settlement-wrap">
    <div class="settle-emoji">😅</div>
    <div class="settle-title fail">挑战失败，再来一次吧！</div>
    <button class="btn-primary big" onclick="retryLevel()">重新挑战</button>
    <div class="settle-secondary">
      <button class="btn-secondary" onclick="goToMap()">返回地图</button>
    </div>
  </div>
</div>

<script src="data.js"></script>
<script src="speech.js"></script>
<script src="titles.js"></script>
<script src="app.js"></script>
</body>
</html>
