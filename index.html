<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
<title>口算闯关营</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body {
  height: 100%;
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: #eef4ff;
  color: #1f2a44;
  overscroll-behavior: none;
}
button { font-family: inherit; border: none; cursor: pointer; }

.screen { height: 100dvh; height: 100vh; width: 100%; overflow: hidden; }

/* ===== 首页 ===== */
.home-wrap {
  height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px; text-align: center; gap: 14px;
  background: linear-gradient(180deg,#dbeafe,#eef4ff 60%);
}
.home-title { font-size: 34px; font-weight: 800; color: #2451c4; }
.home-sub { font-size: 15px; color: #5a6b8c; margin-bottom: 20px; }
.home-note { font-size: 12px; color: #8b98b3; margin-top: 10px; }

.btn-primary {
  background: linear-gradient(135deg,#4f7dfb,#2451c4);
  color: #fff; font-size: 17px; font-weight: 700;
  padding: 16px 28px; border-radius: 16px; box-shadow: 0 6px 16px rgba(36,81,196,.3);
}
.btn-primary.big { width: 100%; max-width: 340px; }
.btn-secondary {
  background: #fff; color: #2451c4; border: 1.5px solid #cfdcff;
  font-size: 15px; font-weight: 600; padding: 12px 20px; border-radius: 14px; flex: 1;
}

/* ===== 顶栏（通用） ===== */
.topbar {
  height: 56px; display: flex; align-items: center; justify-content: space-between;
  padding: env(safe-area-inset-top,0) 14px 0 14px;
  padding-top: max(10px, env(safe-area-inset-top));
  background: #fff; border-bottom: 1px solid #e6ecf9; flex-shrink: 0;
}
.back-btn { background: none; font-size: 15px; color: #2451c4; font-weight: 600; }
.topbar-title { font-size: 15px; font-weight: 700; color: #1f2a44; }

/* ===== 地图页 ===== */
.map-scroll { height: calc(100% - 56px); overflow-y: auto; padding: 16px; }
.level-node {
  display: flex; align-items: center; gap: 12px; background: #fff; border-radius: 14px;
  padding: 14px 16px; margin-bottom: 10px; box-shadow: 0 2px 8px rgba(36,81,196,.06);
}
.level-node.locked { opacity: .5; }
.level-node.current { border: 2px solid #4f7dfb; }
.level-badge { width: 40px; height: 40px; border-radius: 50%; display:flex; align-items:center; justify-content:center; font-weight:800; color:#fff; flex-shrink:0; }
.level-badge.done { background: #ffb300; }
.level-badge.current { background: #4f7dfb; }
.level-badge.locked { background: #b7c2da; }
.level-info-name { font-size: 15px; font-weight: 700; }
.level-info-sub { font-size: 12px; color: #8b98b3; margin-top: 2px; }

/* ===== 答题页：固定五区域 ===== */
.answer-page {
  height: 100%; display: flex; flex-direction: column;
}
.answer-topbar { height: auto; min-height: 56px; padding-bottom: 8px; flex-direction: column; align-items: stretch; gap: 4px; }
.answer-topbar > .back-btn { align-self: flex-start; }
.topbar-mid { display: flex; justify-content: space-between; align-items: center; }
.topbar-stats { display:flex; gap: 10px; font-size: 13px; font-weight: 700; }
.dot-green { color: #16a34a; }
.dot-red { color: #dc2626; }
.timer { position: absolute; right: 14px; top: max(10px, env(safe-area-inset-top)); font-size: 13px; font-weight: 700; color: #2451c4; background:#eef4ff; padding:4px 10px; border-radius:10px; }

.question-area {
  flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center;
  padding: 10px 16px; position: relative;
}
.question-card {
  width: 100%; max-width: 420px; background: #fff; border-radius: 20px;
  box-shadow: 0 8px 24px rgba(36,81,196,.1);
  display: flex; align-items: center; justify-content: center;
  font-size: clamp(32px, 9vw, 52px); font-weight: 800; letter-spacing: 2px;
  padding: clamp(16px, 6vh, 40px) 10px; text-align: center;
}
.question-card.correct { background: #e8fbe9; }
.question-card.wrong { background: #fdecec; }

.speak-btn {
  flex-shrink: 0; margin: 0 auto 6px; display: block; background: #eef4ff; color: #2451c4;
  font-size: 14px; font-weight: 600; padding: 8px 18px; border-radius: 20px;
}

.answer-display {
  flex-shrink: 0; margin: 0 16px 8px; min-height: 42px; background: #fff; border-radius: 12px;
  display: flex; align-items: center; justify-content: center; font-size: 24px; font-weight: 700;
  border: 1.5px solid #e6ecf9;
}

.keypad {
  flex-shrink: 0; display: grid; grid-template-columns: repeat(3, 1fr);
  gap: 8px; padding: 8px 12px max(10px, env(safe-area-inset-bottom));
}
.keypad button {
  height: clamp(44px, 7.5vh, 58px); border-radius: 12px; background: #fff; font-size: 20px; font-weight: 700;
  box-shadow: 0 2px 6px rgba(36,81,196,.08);
}
.keypad .key-func { background: #fff1f1; color: #dc2626; font-size: 15px; }
.keypad .key-confirm { grid-column: span 3; background: linear-gradient(135deg,#4f7dfb,#2451c4); color: #fff; font-size: 18px; }

/* 连击称号浮层 */
.combo-badge {
  position: absolute; left: 50%; top: 20%; transform: translate(-50%,0) scale(.6);
  display: flex; align-items: center; gap: 8px; padding: 10px 20px; border-radius: 999px;
  font-weight: 800; color: #fff; font-size: 18px; opacity: 0; pointer-events: none;
  animation: badgePop 1.4s ease forwards;
  box-shadow: 0 8px 24px rgba(0,0,0,.2);
}
@keyframes badgePop {
  0% { opacity: 0; transform: translate(-50%,10px) scale(.5); }
  15% { opacity: 1; transform: translate(-50%,0) scale(1.1); }
  25% { transform: translate(-50%,0) scale(1); }
  80% { opacity: 1; }
  100% { opacity: 0; transform: translate(-50%,-10px) scale(.9); }
}
.badge-lv1 { background: linear-gradient(135deg,#ff9966,#ff5e3a); }
.badge-lv2 { background: linear-gradient(135deg,#ffd166,#ff9f1c); box-shadow: 0 0 24px rgba(255,159,28,.5); }
.badge-lv3 { background: linear-gradient(135deg,#9d6bff,#5b3df0); }
.badge-lv4 { background: linear-gradient(135deg,#ffd700,#2451c4); box-shadow: 0 0 30px rgba(255,215,0,.6); }
.badge-lv5 { background: linear-gradient(135deg,#ff3d81,#ffb300); box-shadow: 0 0 40px rgba(255,61,129,.7); }

/* ===== 结算页 ===== */
.settlement-wrap {
  height: 100%; overflow-y: auto; display: flex; flex-direction: column; align-items: center;
  padding: 40px 20px max(20px, env(safe-area-inset-bottom)); text-align: center; gap: 14px;
}
.settle-emoji { font-size: 60px; }
.settle-title { font-size: 26px; font-weight: 800; color: #16a34a; }
.settle-title.fail { color: #dc2626; }
.settle-stats { display: flex; gap: 12px; width: 100%; max-width: 380px; margin: 10px 0; }
.stat-box { flex: 1; border-radius: 16px; padding: 16px 8px; }
.stat-green { background: #e8fbe9; }
.stat-blue { background: #eaf1ff; }
.stat-num { font-size: 26px; font-weight: 800; }
.stat-green .stat-num { color: #16a34a; }
.stat-blue .stat-num { color: #2451c4; }
.stat-label { font-size: 12px; color: #8b98b3; margin-top: 4px; }

.settle-titles-label { font-size: 14px; color: #8b98b3; margin-top: 4px; }
.settle-titles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; max-width: 400px; }
.settle-titles .pill {
  display: flex; align-items: center; gap: 6px; padding: 8px 16px; border-radius: 999px;
  color: #fff; font-weight: 700; font-size: 14px;
}

.settle-secondary { display: flex; gap: 10px; width: 100%; max-width: 340px; margin-top: 4px; }

</style>
</head>
<body>

<!-- 首页 -->
<div id="screen-home" class="screen">
  <div class="home-wrap">
    <h1 class="home-title">口算闯关营</h1>
    <p class="home-sub">每天练一点，口算更厉害！</p>
    <button class="btn-primary big" onclick="goToMap()">🌱 学前班 · 开始闯关</button>
    <p class="home-note">（当前核心版本已实现学前班12关，其余年级陆续接入）</p>
  </div>

<!-- 地图页 -->
<div id="screen-map" class="screen" style="display:none;">

<!-- 结算页 -->

<script>
// ===== 口算闯关营 - 学前班题库生成器 =====

function numText(n) {
  return String(n);
}

function makeQ(a, op, b, answer) {
  const expr = `${a} ${op} ${b} = ?`;
  const opWord = op === '+' ? '加' : '减';
  const speechText = `${numText(a)}${opWord}${numText(b)}等于多少`;
  return {
    id: `${a}${op}${b}`,
    expression: expr,
    a, b, op, answer,
    speechText,
    type: 'arith'
  };
}

function genAddPool(max, opts = {}) {
  const { noCarry = false, minSum = 0 } = opts;
  const pool = [];
  for (let a = 0; a <= max; a++) {
    for (let b = 0; b <= max; b++) {
      const sum = a + b;
      if (sum > max) continue;
      if (sum < minSum) continue;
      if (noCarry && (a % 10 + b % 10) >= 10) continue;
      if (a === 0 && b === 0) continue;
      pool.push(makeQ(a, '+', b, sum));
    }
  }
  return pool;
}

function genSubPool(max, opts = {}) {
  const { noBorrow = null, minA = 0 } = opts;
  const pool = [];
  for (let a = minA; a <= max; a++) {
    for (let b = 0; b <= a; b++) {
      const diff = a - b;
      if (noBorrow === true && (a % 10) < (b % 10)) continue;
      if (noBorrow === false && (a % 10) >= (b % 10)) continue;
      if (a === 0 && b === 0) continue;
      pool.push(makeQ(a, '-', b, diff));
    }
  }
  return pool;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(pool, n) {
  return shuffle(pool).slice(0, Math.min(n, pool.length));
}

const LEVEL_POOLS = {
  1: () => genAddPool(10),
  2: () => genSubPool(10),
  3: () => shuffle([...genAddPool(10), ...genSubPool(10)]),
  4: () => genAddPool(20, { noCarry: true, minSum: 11 }),
  5: () => genSubPool(20, { noBorrow: true, minA: 11 }),
  6: () => shuffle([
              ...genAddPool(20, { minSum: 11 }).filter(q => (q.a % 10 + q.b % 10) >= 10),
              ...genSubPool(20, { noBorrow: false, minA: 11 })
            ]),
  7: () => shuffle([
              ...genAddPool(20, { minSum: 11 }),
              ...genSubPool(20, { minA: 11 })
            ]),
  8: () => genAddPool(30, { minSum: 21 }),
  9: () => genSubPool(30, { minA: 21 }),
  10: () => genAddPool(50, { minSum: 31 }),
  11: () => genSubPool(50, { minA: 31 }),
  12: () => shuffle([
              ...genAddPool(50, { minSum: 31 }),
              ...genSubPool(50, { minA: 31 })
            ]),
};

const LEVEL_NAMES = {
  1: '10以内加法', 2: '10以内减法', 3: '10以内加减综合',
  4: '20以内加法', 5: '20以内减法', 6: '20以内进退位',
  7: '20以内综合挑战', 8: '30以内加法', 9: '30以内减法',
  10: '50以内加法', 11: '50以内减法', 12: '50以内终极挑战'
};

function getLevelQuestions(levelNum) {
  const pool = LEVEL_POOLS[levelNum]();
  return pick(pool, 20);
}

window.KOUSUAN_DATA = { getLevelQuestions, LEVEL_NAMES, TOTAL_LEVELS: 12 };


// ===== 语音播放队列 =====

class SpeechQueue {
  constructor() {
    this.queue = [];
    this.speaking = false;
    this.currentUtteranceId = 0;
    this.enabled = true;
  }

  stopAll() {
    if ('speechSynthesis' in window) {
      try { window.speechSynthesis.cancel(); } catch (e) {}
    }
    this.queue = [];
    this.speaking = false;
    this.currentUtteranceId++;
  }

  enqueue(text, { rate = 1, pitch = 1, onEnd = null } = {}) {
    const id = this.currentUtteranceId;
    this.queue.push({ text, rate, pitch, onEnd, id });
    this._processNext();
  }

  speakImmediate(text, { rate = 1, pitch = 1, onEnd = null } = {}) {
    this.stopAll();
    this.enqueue(text, { rate, pitch, onEnd });
  }

  _processNext() {
    if (this.speaking) return;
    const item = this.queue.shift();
    if (!item) return;
    this.speaking = true;
    const myId = item.id;

    if (!('speechSynthesis' in window)) {
      this.speaking = false;
      if (item.onEnd) item.onEnd();
      this._processNext();
      return;
    }

    let utter;
    try {
      utter = new SpeechSynthesisUtterance(item.text);
      utter.lang = 'zh-CN';
      utter.rate = item.rate;
      utter.pitch = item.pitch;
    } catch (e) {
      this.speaking = false;
      if (item.onEnd) item.onEnd();
      this._processNext();
      return;
    }

    const finish = () => {
      if (myId !== this.currentUtteranceId) return;
      this.speaking = false;
      if (item.onEnd) item.onEnd();
      this._processNext();
    };
    utter.onend = finish;
    utter.onerror = finish;

    try {
      window.speechSynthesis.speak(utter);
    } catch (e) {
      finish();
    }
  }
}

window.speechQueue = new SpeechQueue();


// ===== 闯关评级与称号系统 =====

const ENCOURAGE_WORDS = [
  '太厉害了', '游刃有余', '无人能挡', '横扫千军', '神机妙算', '百战百胜'
];

function randomEncourage() {
  return ENCOURAGE_WORDS[Math.floor(Math.random() * ENCOURAGE_WORDS.length)];
}

const COMBO_TITLES = [
  { threshold: 18, name: 'MVP连胜王', icon: '👑', cls: 'badge-lv5', rate: 1.3, pitch: 1.4 },
  { threshold: 15, name: '收割战神', icon: '🏆', cls: 'badge-lv4', rate: 1.25, pitch: 1.3 },
  { threshold: 10, name: '常胜将军', icon: '💎', cls: 'badge-lv3', rate: 1.15, pitch: 1.2 },
  { threshold: 5,  name: '五连绝世', icon: '⚡', cls: 'badge-lv2', rate: 1.1,  pitch: 1.1 },
  { threshold: 3,  name: '三连决胜', icon: '🔥', cls: 'badge-lv1', rate: 1.0,  pitch: 1.0 },
];

function checkComboTitle(streak, announcedMaxThreshold) {
  for (const t of COMBO_TITLES) {
    if (streak >= t.threshold && t.threshold > announcedMaxThreshold) {
      return t;
    }
  }
  return null;
}

function computeSettlementTitles({ firstRoundCorrect, firstRoundWrong, avgSeconds, maxComboReached }) {
  const total = firstRoundCorrect + firstRoundWrong;
  const accuracy = total > 0 ? firstRoundCorrect / total : 0;
  const titles = [];

  const isPerfect = firstRoundWrong === 0;
  const isUltimate = maxComboReached >= 10 && isPerfect && avgSeconds < 15;

  if (isUltimate) {
    titles.push({ name: '绝世无双王者', icon: '👑', cls: 'badge-lv5', desc: '速度、准确率、连答全部拉满，获得终极绝世无双王者' });
  } else {
    if (isPerfect) titles.push({ name: '最强王者', icon: '⭐', cls: 'badge-lv4', desc: '整关零失误完美通关，获得最强王者' });
    else if (accuracy >= 0.85) titles.push({ name: '暴击王者', icon: '💥', cls: 'badge-lv3', desc: '计算稳定性拉满，获得暴击王者' });

    if (avgSeconds < 30) titles.push({ name: '闪电王者', icon: '⚡', cls: 'badge-lv3', desc: '看题秒出答案，获得闪电王者' });
    else if (avgSeconds < 40) titles.push({ name: '疾行王者', icon: '💨', cls: 'badge-lv2', desc: '答题速度远超标准，获得疾行王者' });
  }
  return titles;
}

window.KOUSUAN_TITLES = { randomEncourage, COMBO_TITLES, checkComboTitle, computeSettlementTitles };


// ===== 口算闯关营 - 主逻辑 =====

const TOTAL_QUESTIONS = 20;
const TIME_LIMIT_SEC = 600;

let state = null;
let timerHandle = null;

function loadProgress() {
  try {
    return JSON.parse(localStorage.getItem('kousuan_progress') || '{}');
  } catch (e) { return {}; }
}
function saveProgress(p) {
  localStorage.setItem('kousuan_progress', JSON.stringify(p));
}
function getUnlockedLevel() {
  const p = loadProgress();
  return p.maxUnlocked || 1;
}
function unlockNext(levelNum) {
  const p = loadProgress();
  p.maxUnlocked = Math.max(p.maxUnlocked || 1, levelNum + 1);
  saveProgress(p);
}

function showScreen(id) {
  document.querySelectorAll('.screen').forEach(el => el.style.display = 'none');
  document.getElementById(id).style.display = 'block';
}

function goHome() {
  window.speechQueue.stopAll();
  showScreen('screen-home');
}

function goToMap() {
  window.speechQueue.stopAll();
  renderMap();
  showScreen('screen-map');
}

function renderMap() {
  const unlocked = getUnlockedLevel();
  const p = loadProgress();
  const done = p.completedLevels || [];
  const list = document.getElementById('map-list');
  list.innerHTML = '';
  for (let i = 1; i <= window.KOUSUAN_DATA.TOTAL_LEVELS; i++) {
    const isDone = done.includes(i);
    const isLocked = i > unlocked;
    const isCurrent = i === unlocked && !isDone;
    const div = document.createElement('div');
    div.className = 'level-node ' + (isLocked ? 'locked' : isCurrent ? 'current' : '');
    div.innerHTML = `
      <div class="level-badge ${isDone ? 'done' : isLocked ? 'locked' : 'current'}">
        ${isDone ? '⭐' : isLocked ? '🔒' : i}
      </div>
      <div>
        <div class="level-info-name">第${i}关 · ${window.KOUSUAN_DATA.LEVEL_NAMES[i]}</div>
        <div class="level-info-sub">${isDone ? '已通关，可重玩' : isLocked ? '完成前一关解锁' : '当前可挑战'}</div>
      </div>`;
    if (!isLocked) div.onclick = () => startLevel(i);
    list.appendChild(div);
  }
}

function startLevel(levelNum) {
  window.speechQueue.stopAll();
  const questions = window.KOUSUAN_DATA.getLevelQuestions(levelNum);
  state = {
    levelNum,
    questions,
    phase: 'first',
    index: 0,
    correctCount: 0,
    wrongCount: 0,
    wrongQueue: [],
    retryIndex: 0,
    retryFailed: false,
    comboStreak: 0,
    announcedMaxThreshold: 0,
    overallBestThreshold: 0,
    maxComboReached: 0,
    currentInput: '',
    startTime: Date.now(),
    questionStartTime: Date.now(),
    questionTimes: [],
    remainingSec: TIME_LIMIT_SEC,
  };
  document.getElementById('level-title').textContent =
    `学前班·第${levelNum}关`;
  showScreen('screen-answer');
  startTimer();
  renderQuestion();
}

function startTimer() {
  clearInterval(timerHandle);
  timerHandle = setInterval(() => {
    if (!state) return;
    state.remainingSec--;
    updateTimerUI();
    if (state.remainingSec <= 0) {
      clearInterval(timerHandle);
      onTimeout();
    }
  }, 1000);
  updateTimerUI();
}
function updateTimerUI() {
  const m = Math.floor(state.remainingSec / 60).toString().padStart(2, '0');
  const s = (state.remainingSec % 60).toString().padStart(2, '0');
  document.getElementById('timer').textContent = `${m}:${s}`;
}

function currentQuestion() {
  if (state.phase === 'first') return state.questions[state.index];
  return state.wrongQueue[state.retryIndex];
}

function renderQuestion() {
  const q = currentQuestion();
  state.currentInput = '';
  state.questionStartTime = Date.now();
  document.getElementById('answer-display').textContent = '';
  const card = document.getElementById('question-card');
  card.className = 'question-card';
  card.textContent = q.expression;

  const totalLabel = state.phase === 'first'
    ? `第${state.index + 1}/${TOTAL_QUESTIONS}题`
    : `错题重答 ${state.retryIndex + 1}/${state.wrongQueue.length}`;
  document.getElementById('qindex').textContent = totalLabel;
  document.getElementById('correct-count').textContent = '🟢' + state.correctCount;
  document.getElementById('wrong-count').textContent = '🔴' + state.wrongCount;

  window.speechQueue.speakImmediate(q.speechText, { rate: 1, pitch: 1 });
}

function manualSpeak() {
  const q = currentQuestion();
  if (!q) return;
  window.speechQueue.speakImmediate(q.speechText, { rate: 1, pitch: 1 });
}

function keypadInput(d) {
  if (state.currentInput.length >= 4) return;
  state.currentInput += d;
  document.getElementById('answer-display').textContent = state.currentInput;
}
function keypadClear() {
  state.currentInput = '';
  document.getElementById('answer-display').textContent = '';
}
function keypadDelete() {
  state.currentInput = state.currentInput.slice(0, -1);
  document.getElementById('answer-display').textContent = state.currentInput;
}

function keypadConfirm() {
  if (state.currentInput === '') {
    const disp = document.getElementById('answer-display');
    disp.textContent = '请输入答案';
    disp.style.color = '#dc2626';
    setTimeout(() => { disp.style.color = ''; disp.textContent = state.currentInput; }, 900);
    return;
  }
  const q = currentQuestion();
  const userAnswer = parseInt(state.currentInput, 10);
  const isCorrect = userAnswer === q.answer;
  const elapsed = (Date.now() - state.questionStartTime) / 1000;
  state.questionTimes.push(elapsed);

  const card = document.getElementById('question-card');
  card.classList.add(isCorrect ? 'correct' : 'wrong');

  if (state.phase === 'first') {
    if (isCorrect) {
      state.correctCount++;
      state.comboStreak++;
      state.maxComboReached = Math.max(state.maxComboReached, state.comboStreak);
    } else {
      state.wrongCount++;
      state.wrongQueue.push(q);
      state.comboStreak = 0;
      state.announcedMaxThreshold = 0;
    }
  } else {
    if (!isCorrect) state.retryFailed = true;
  }

  document.getElementById('correct-count').textContent = '🟢' + state.correctCount;
  document.getElementById('wrong-count').textContent = '🔴' + state.wrongCount;

  let titleTriggered = null;
  if (state.phase === 'first' && isCorrect) {
    titleTriggered = window.KOUSUAN_TITLES.checkComboTitle(state.comboStreak, state.announcedMaxThreshold);
  }

  if (titleTriggered) {
    state.announcedMaxThreshold = titleTriggered.threshold;
    state.overallBestThreshold = Math.max(state.overallBestThreshold, titleTriggered.threshold);
    showComboBadge(titleTriggered);
    const encourage = window.KOUSUAN_TITLES.randomEncourage();
    window.speechQueue.enqueue(`${encourage}！${titleTriggered.name}！`, {
      rate: titleTriggered.rate,
      pitch: titleTriggered.pitch,
      onEnd: () => { setTimeout(advance, 300); }
    });
  } else {
    setTimeout(advance, 700);
  }
}

function showComboBadge(title) {
  const layer = document.getElementById('combo-badge-layer');
  layer.innerHTML = '';
  const el = document.createElement('div');
  el.className = 'combo-badge ' + title.cls;
  el.innerHTML = `<span style="font-size:22px">${title.icon}</span><span>${title.name}</span>`;
  layer.appendChild(el);
  setTimeout(() => { el.remove(); }, 1500);
}

function advance() {
  if (!state) return;
  if (state.phase === 'first') {
    state.index++;
    if (state.index < TOTAL_QUESTIONS) {
      renderQuestion();
    } else {
      if (state.wrongCount === 0) {
        finishLevel(true);
      } else {
        state.phase = 'retry';
        state.retryIndex = 0;
        renderQuestion();
      }
    }
  } else {
    state.retryIndex++;
    if (state.retryIndex < state.wrongQueue.length) {
      renderQuestion();
    } else {
      finishLevel(!state.retryFailed);
    }
  }
}

function onTimeout() {
  window.speechQueue.stopAll();
  showScreen('screen-failed');
  document.querySelector('#screen-failed .settle-title').textContent = '时间到啦，再挑战一次吧！';
}

function confirmExit() {
  if (confirm('当前进度未保存，确定退出吗？')) {
    clearInterval(timerHandle);
    window.speechQueue.stopAll();
    goToMap();
  }
}

function finishLevel(success) {
  clearInterval(timerHandle);
  window.speechQueue.stopAll();
  const totalTimeSec = Math.round((Date.now() - state.startTime) / 1000);

  if (!success) {
    showScreen('screen-failed');
    document.querySelector('#screen-failed .settle-title').textContent = '挑战失败，再来一次吧！';
    return;
  }

  const p = loadProgress();
  p.completedLevels = p.completedLevels || [];
  if (!p.completedLevels.includes(state.levelNum)) p.completedLevels.push(state.levelNum);
  unlockNext(state.levelNum);

  document.getElementById('settle-title').textContent = '闯关成功！';
  document.getElementById('settle-emoji').textContent = '🎉';
  document.getElementById('stat-correct').textContent = `${state.correctCount}/${TOTAL_QUESTIONS}`;
  const m = Math.floor(totalTimeSec / 60).toString().padStart(2, '0');
  const s = (totalTimeSec % 60).toString().padStart(2, '0');
  document.getElementById('stat-time').textContent = `${m}:${s}`;

  const avgSeconds = state.questionTimes.reduce((a, b) => a + b, 0) / state.questionTimes.length;
  const titles = window.KOUSUAN_TITLES.computeSettlementTitles({
    firstRoundCorrect: state.correctCount,
    firstRoundWrong: state.wrongCount,
    avgSeconds,
    maxComboReached: state.maxComboReached
  });

  const comboAchieved = window.KOUSUAN_TITLES.COMBO_TITLES.find(t => t.threshold === state.overallBestThreshold);
  const allTitles = [];
  if (comboAchieved) allTitles.push({ name: comboAchieved.name, icon: comboAchieved.icon, cls: comboAchieved.cls, desc: `${comboAchieved.name}！` });
  allTitles.push(...titles);

  const titlesEl = document.getElementById('settle-titles');
  titlesEl.innerHTML = '';
  allTitles.forEach(t => {
    const pill = document.createElement('div');
    pill.className = 'pill ' + t.cls;
    pill.innerHTML = `<span>${t.icon}</span><span>${t.name}</span>`;
    titlesEl.appendChild(pill);
  });

  const isLast = state.levelNum >= window.KOUSUAN_DATA.TOTAL_LEVELS;
  document.getElementById('btn-next-level').style.display = isLast ? 'none' : 'block';

  showScreen('screen-settlement');

  allTitles.forEach(t => {
    window.speechQueue.enqueue(t.desc || `获得${t.name}`, { rate: 1.1, pitch: 1.1 });
  });
}

function challengeNext() {
  const next = state.levelNum + 1;
  if (next > window.KOUSUAN_DATA.TOTAL_LEVELS) { goToMap(); return; }
  startLevel(next);
}
function retryLevel() {
  startLevel(state.levelNum);
}

goHome();

</script>
